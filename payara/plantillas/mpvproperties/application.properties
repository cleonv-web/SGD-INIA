#TERMINOS Y CONDICIONES
TERMINO_TITULO=Estimado/a usuario/a: para mayor facilidad, se ha puesto a su disposición este formulario, que le permitirá el envío de documentos a la Presidencia de Consejo de Ministros-PCM. Sin embargo, antes de ingresar su documento debe tener en cuenta lo siguiente:
TERMINO_I=<b>Horario: Para el envío:</b> es de lunes a domingo, las 24 horas del día. Para la recepción: es de 8:30 a.m. a 4:30 p.m. de lunes a viernes. Sin embargo, es necesario precisar lo siguiente:
TERMINO_II=Si el/la usuario/a realiza un trámite fuera del horario de 8:30 a.m. a 4:30 p.m. <b>se considerará:</b> i) Después de las 4:30 p.m. hasta las 11:59 p.m., presentado el siguiente día hábil. ii) Entre las 00:00 horas y las 8:30 a.m. de días hábiles, presentado el mismo día. iii) Sábados, domingos y feriados, presentado el siguiente día hábil.
TERMINO_III=<b>1. Datos del solicitante:</b>
TERMINO_IV=Es Obligatorio consignar lo siguiente: Tipo de persona: Ciudadano ó Persona Jurídica; Número de DNI; Apellidos y Nombres; Teléfono; Dirección y Correo electrónico.
TERMINO_V=Sobre el <b>correo electrónico</b>, al marcar <b>ACEPTAR</b> el solicitante, declara bajo juramento la veracidad y autenticidad de los datos y de la documentación presentada. Asimismo autoriza a la PCM a remitir el cargo de recepción y todo tipo de información o respuesta correspondiente a su solicitud, al correo electrónico consignado (el cual debe ser validado por la PCM para verificar que no se trate de correos no deseados).
TERMINO_VI=<b>2. Datos del documento:</b>
TERMINO_VII=El documento dirigido a la PCM deberá, estar firmado conforme a los tipos de firmas (manuscrita, digitalizada o escaneada, electrónica y digital), convertido en formato PDF y contener todos los datos de quien lo suscriba, obligatoriamente.
TERMINO_VIII=Escanearse en forma ordenada, legible y completa. De preferencia en formato OCR (Reconocimiento Óptico de Caracteres).
TERMINO_IX=Al momento de la presentación, el remitente debe consignar: Tipo de documento; Número; N° de Folios y Asunto.
TERMINO_X=<b>3. La PCM comunicará a través del correo electrónico lo siguiente:</b>
TERMINO_XI=Envío del Voucher de Expediente (constancia del registro de envío del documento en forma exitosa), consignando:<b>Expediente N° 2022-000XXXX</b>.
TERMINO_XII=Sin embargo, en caso exista alguna <b>observación</b>, se otorgará el plazo de dos días hábiles para la subsanación, contados a partir del día siguiente hábil de la recepción de la observación y que podrá realizarse a través de la plataforma, consignando el número de expediente presentado inicialmente. Vencido dicho plazo el documento se considerará no presentado.
TERMINO_XIII=<b>4.</b> En caso se supere la capacidad máxima prevista en el sistema debe presentarse a través de los canales presenciales, que se encuentran atendiendo de lunes a viernes en su horario regular de 8:30 a.m. a 4:30 p.m.
TERMINO_XIV=Para cualquier consulta sobre: i) requisitos de admisibilidad, ii) recepción del documento, iii) número del expediente generado y/o iv) seguimiento del expediente, pueden comunicarse al Teléfono: (01) 2197000 anexos: 1237 y 1238, en el mismo horario.
TERMINO_XV=Marcar <b>ACEPTAR</b> a los compromisos y condiciones, para que pueda acceder al formulario de presentación del documento, el cual, tiene carácter de declaración jurada y usted será responsable de la documentación e información remitida a través de ella.
