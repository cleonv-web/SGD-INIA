<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <style>
        body {
            font: 62.5% "Trebuchet MS", sans-serif;
            margin: 50px;
        }
    </style>
</h:head>
<body>

<p:dialog widgetVar="detalleTramiteDialogWidget"
          id="detalleTramiteDialogId" height="600" width="900" modal="true"
          closable="true" draggable="false" resizable="false" maximizable="false"
          appendTo="@(body)">
    <h:form id="frmDetalleRecepcionExterna" enctype="multipart/form-data">
        <p:growl id="messages" showDetail="true"/>

        <p:accordionPanel>
            <p:tab title="Detalle Documento">
                <div class="ui-fluid">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6 ui-lg-10">
                            <p:outputLabel value="Ent. Emisora"/>
                            <p:inputText id="idRegNomEnt"
                                         value="#{cRecepcionExterna.consultaDocumento.vnomentemi}"
                                         readonly="true"/>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-5">
                            <p:outputLabel value="Tipo Documento"/>
                            <p:selectOneMenu id="idRegTipDoc"
                                             value="#{cRecepcionExterna.consultaDocumento.ccodtipdoc}">
                                <f:selectItems value="#{cRecepcionExterna.cbotipdocmv}" var="tipDoc"
                                               itemLabel="#{tipDoc.cdoc_desdoc}" itemValue="#{tipDoc.cidtipdoc}"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-5">
                            <p:outputLabel value="Num. Documento"/>
                            <p:inputText id="idRegNumDoc"
                                         value="#{cRecepcionExterna.consultaDocumento.vnumdoc}"
                                         readonly="true"/>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-5">
                            <p:outputLabel value="Fec. Documento"/>
                            <p:calendar id="idRegFecDoc"
                                        value="#{cRecepcionExterna.consultaDocumento.dfecdoc}" readonly="true"
                                        showOn="" pattern="dd-MM-yyyy"/>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-7">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-10">
                            <p:outputLabel value="Nom. Und. Org. Destino"/>
                            <p:inputText id="idRegUniOrgDst"
                                         value="#{cRecepcionExterna.consultaDocumento.vuniorgdst}"
                                         readonly="true"/>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-10">
                            <p:outputLabel value="Nom. Destinatario"/>
                            <p:inputText id="idRegNomDstn"
                                         value="#{cRecepcionExterna.consultaDocumento.vnomdst}" readonly="true"
                            />
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-10">
                            <p:outputLabel value="Car. Destinatario"/>
                            <p:inputText id="idRegCarDstn"
                                         value="#{cRecepcionExterna.consultaDocumento.vnomcardst}" readonly="true"/>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-10">
                            <p:outputLabel value="Asunto"/>
                            <p:inputTextarea id="idRegAsunto"
                                             value="#{cRecepcionExterna.consultaDocumento.vasu}"
                                             cols="50" rows="5" counter="display2" maxlength="500"
                                             counterTemplate="{0} Cantidad de carateres."
                                             autoResize="false" readonly="true"/>
                            <h:outputText id="display2"/>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-10">
                            <p:outputLabel value="Archivo Principal"/>
                            <p:commandButton icon="ui-icon-document" action="#{cRecepcionExterna.documentoPrincipal()}"
                                             immediate="true" update=":frmRecExternaDocumentoPrincipal">
                            </p:commandButton>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-5">
                            <p:outputLabel value="Num. Anexos"/>
                            <p:inputText id="idRegNumAnx"
                                         value="#{cRecepcionExterna.consultaDocumento.snumanx}"
                                         size="50" readonly="true"/>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-7">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-10">
                            <p:outputLabel value="Anexo"/>
                            <p:dataList id="idRegDocAnx"
                                        value="#{cRecepcionExterna.lstDocAnexo}" var="anexo"
                                        type="ordered">
                                <f:facet name="header">
                                    Anexo
                                </f:facet>
                                #{anexo.vnomdoc}
                            </p:dataList>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-5">
                            <p:outputLabel value="CUO"/>
                            <p:inputText id="idRegCuo"
                                         value="#{cRecepcionExterna.consultaDocumento.vcuo}"
                                         readonly="true"/>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-5">
                            <p:outputLabel value="CUO Referencia"/>
                            <p:inputText id="idRegCuoRef"
                                         value="#{cRecepcionExterna.consultaDocumento.vcuoref}"
                                         readonly="true"/>
                        </div>
                        <div class="ui-g-12 ui-md-6 ui-lg-2">
                        </div>
                    </div>

                </div>
            </p:tab>
            <p:tab title="Registro SGD"
                   disabled="#{cRecepcionExterna.consultaDocumento.cflgest.equals('P')?true:false}">
                <div class="ui-fluid">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-12">

                            <div class="ui-g">
                                <div class="ui-g-12 ui-md-6 ui-lg-8">
                                    <p:outputLabel value="Unidad Orgánica Destino"/>
                                    <p:selectOneMenu id="idRegOfiStd"
                                                     value="#{cRecepcionExterna.consultaDocumento.ccoduniorgstd}">
                                        <f:selectItems value="#{cRecepcionExterna.cboOficina}" var="oficina"
                                                       itemLabel="#{oficina.cNomOficina}"
                                                       itemValue="#{oficina.cCodOficina}"
                                                       itemDisabled="true"/>
                                    </p:selectOneMenu>
                                </div>
                            </div>
                            <div class="ui-g">
                                <div class="ui-g-12 ui-md-6 ui-lg-4">
                                    <p:outputLabel value="Año Expediente"/>
                                    <p:inputText id="idRegAnio"
                                                 value="#{cRecepcionExterna.consultaDocumento.vanioregstd}"
                                                 readonly="true"/>
                                </div>
                                <div class="ui-g-12 ui-md-6 ui-lg-4">
                                    <p:outputLabel value="Num. Expediente"/>
                                    <p:inputText id="idRegNum"
                                                 value="#{cRecepcionExterna.consultaDocumento.vnumregstd}"
                                                 readonly="true"/>
                                </div>
                            </div>
                            <div class="ui-g">
                                <div class="ui-g-12 ui-md-6 ui-lg-8">
                                    <p:outputLabel value="Fec. Registro Expediente"/>
                                    <p:inputText id="idRegFec"
                                                 value="#{cRecepcionExterna.consultaDocumento.dfecregstd0}"
                                                 readonly="true"/>
                                </div>
                            </div>


                            <p:spacer height="20px"></p:spacer>

                            <div class="ui-g">
                                <div class="ui-g-12 ui-md-6 ui-lg-4">
                                    <h:outputLabel value="Estado"/>
                                    <p:selectOneMenu id="idRegEst"
                                                     value="#{cRecepcionExterna.consultaDocumento.cflgest}"
                                                     required="true" requiredMessage="Seleccione estado">
                                        <f:selectItem itemLabel="Recepcionado" itemValue="R" itemDisabled="true"/>
                                        <f:selectItem itemLabel="Observado" itemValue="O" itemDisabled="true"/>
                                    </p:selectOneMenu>
                                </div>
                            </div>
                            <div class="ui-g">
                                <div class="ui-g-12 ui-md-6 ui-lg-8">
                                    <p:outputLabel value="Observación"/>
                                    <p:inputTextarea id="idRegObs"
                                                     value="#{cRecepcionExterna.consultaDocumento.vobs}"
                                                     cols="50" rows="5" counter="display3" maxlength="500"
                                                     counterTemplate="{0} Cantidad de carateres."
                                                     autoResize="false"
                                                     readonly="true"/>
                                    <h:outputText id="display3"/>
                                </div>
                            </div>
                            <div class="ui-g">
                                <div class="ui-g-12 ui-md-6 ui-lg-8">
                                    <!-- <p:media value="#{cVariableSession.documentoPrincipalCargo!=null? cVariableSession.documentoPrincipalCargo:ruta.perfil}"
                                             width="100%" height="100%" player="pdf">
                                    </p:media> -->
                                    <p:outputLabel value="Cargo"/>
                                    <p:commandButton icon="ui-icon-document" value="Documentos"
                                                     action="#{cRecepcionExterna.cargoDocumento()}"
                                                     immediate="true" update=":frmCargoDocumento">
                                    </p:commandButton>
                                </div>
                            </div>


                        </div>

                    </div>
                </div>
            </p:tab>
        </p:accordionPanel>


    </h:form>

    <ui:include src="pdf_documentoPrincipal.xhtml"/>
    <ui:include src="pdf_cargoFirmado.xhtml"/>
</p:dialog>
</body>
</html>
